<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
  <meta http-equiv="Permissions-Policy" content="interest-cohort=(), browsing-topics=()" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Карта покрытия МТС | Проверка 5G, 4G, 3G</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%23e30611'/><text x='50%' y='68%' font-size='42' font-weight='bold' fill='white' text-anchor='middle' font-family='sans-serif'>MTS</text></svg>" />
  
  
  
  <!-- Cache buster v3.5 -->
  <link rel="stylesheet" href="style.css?v=4.0" />
  <!-- Yandex Maps API v2.1 -->
  <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU" type="text/javascript"></script>
</head>
<body>
  <div class="app-container">
    <!-- Адаптивная верхняя панель (100% помещается на любых смартфонах) -->
    <header class="top-bar">
      <div class="top-row">
        <!-- Логотип -->
        <div class="brand">
          <div class="brand-logo">МТС</div>
          <span class="brand-title desktop-only">Покрытие</span>
        </div>

        <!-- Поисковая строка -->
        <div class="search-section">
          <div class="search-input-wrapper">
            <svg class="search-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input 
              type="text" 
              id="addressInput" 
              placeholder="Адрес или координаты..." 
              autocomplete="off" 
            />
            <button id="clearSearchBtn" class="clear-btn" title="Очистить">&times;</button>
          </div>

          <!-- Кнопка поиска (иконка на мобильном, текст на десктопе) -->
          <button id="searchBtn" class="btn btn-search" title="Найти">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span class="btn-text desktop-only">Найти</span>
          </button>

          <!-- Кнопка геолокации в шапке (компактная на мобильном) -->
          <button id="geoBtn" class="btn btn-accent" title="Моё местоположение (GPS)">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2">
              <circle cx="12" cy="12" r="3.5" fill="currentColor"></circle>
              <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
              <circle cx="12" cy="12" r="8"></circle>
            </svg>
            <span class="btn-text desktop-only">Моё местоположение</span>
          </button>
        </div>
      </div>

      <!-- Горизонтальная лента сетей и городов (плавно скроллится пальцем) -->
      <div class="layer-chips-container">
        <div class="layer-chips" id="layerTabs">
          <button class="layer-chip active" data-layer="g5_New" data-name="5G 300М">
            <span class="chip-dot g5-dot"></span>
            5G 300М
          </button>
          <button class="layer-chip" data-layer="g5" data-name="Супер 5G">
            <span class="chip-dot g5super-dot"></span>
            Супер 5G
          </button>
          <button class="layer-chip" data-layer="lte_New" data-name="4G LTE">
            <span class="chip-dot lte-dot"></span>
            4G LTE
          </button>
          <button class="layer-chip" data-layer="g3_New" data-name="3G">
            <span class="chip-dot g3-dot"></span>
            3G
          </button>
          <button class="layer-chip" data-layer="g2_New" data-name="2G">
            <span class="chip-dot g2-dot"></span>
            2G
          </button>
          <button class="layer-chip" data-layer="nb_iot" data-name="NB-IoT">
            <span class="chip-dot nbiot-dot"></span>
            NB-IoT
          </button>
        </div>

        <div class="chips-divider"></div>

        <!-- Пресеты городов -->
        <div class="city-chips">
          <button class="city-chip" data-lat="55.7903" data-lon="49.1228" data-zoom="12">Казань</button>
          <button class="city-chip" data-lat="55.7522" data-lon="48.7447" data-zoom="14">Иннополис</button>
          <button class="city-chip" data-lat="55.7436" data-lon="52.4089" data-zoom="12">Челны</button>
          <button class="city-chip" data-lat="54.9014" data-lon="52.2972" data-zoom="12">Альметьевск</button>
          <button class="city-chip" data-lat="55.7558" data-lon="37.6173" data-zoom="11">Москва</button>
        </div>
      </div>
    </header>

    <!-- Основная область с картой (100% экрана) -->
    <main class="map-wrapper">
      <div id="map"></div>

      <!-- Круглая плавающая кнопка GPS прямо под большой палец -->
      <button id="fabGeoBtn" class="fab-geo-btn" title="Определить моё местоположение">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="3.5" fill="currentColor"></circle>
          <path d="M12 2v3m0 14v3M2 12h3m14 0h3"></path>
          <circle cx="12" cy="12" r="8"></circle>
        </svg>
      </button>

      <!-- КОМПАКТНАЯ ПЛАВАЮЩАЯ МИНИ-ПЛАШКА СНИЗУ (~46px) -->
      <div class="bottom-pill hidden" id="bottomPill">
        <div class="pill-content" id="pillToggleArea">
          <span class="pill-pin">📍</span>
          <div class="pill-info">
            <span class="pill-address" id="pillAddress">Определение адреса...</span>
            <span class="pill-coords" id="pillCoords">55.7903, 49.1228</span>
          </div>
          <span class="pill-badge" id="pillBadge">5G 300М</span>
          <button class="pill-expand-arrow" id="pillExpandBtn" title="Подробнее">
            <svg class="chevron-arrow" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="18 15 12 9 6 15"></polyline>
            </svg>
          </button>
        </div>
        <button class="pill-close-btn" id="pillCloseBtn" title="Закрыть">&times;</button>
      </div>

      <!-- Выпадающее компактное окно подробностей -->
      <div class="details-dropdown hidden" id="detailsDropdown">
        <div class="dropdown-header">
          <span>Сети в этой точке:</span>
          <button class="dropdown-close" id="detailsCloseBtn">&times;</button>
        </div>
        <div class="dropdown-grid">
          <div class="tech-row" data-layer-click="g5_New">
            <span class="tech-label">🚀 5G до 300 Мбит/с</span>
            <span class="tech-val" id="status-g5_New">Слой на карте</span>
          </div>
          <div class="tech-row" data-layer-click="g5">
            <span class="tech-label">⚡ Супер 5G (1.5 Гбит/с)</span>
            <span class="tech-val" id="status-g5">Клик для показа</span>
          </div>
          <div class="tech-row" data-layer-click="lte_New">
            <span class="tech-label">📶 4G LTE</span>
            <span class="tech-val" id="status-lte_New">Клик для показа</span>
          </div>
          <div class="tech-row" data-layer-click="g3_New">
            <span class="tech-label">🌐 3G</span>
            <span class="tech-val" id="status-g3_New">Клик для показа</span>
          </div>
          <div class="tech-row" data-layer-click="g2_New">
            <span class="tech-label">📞 2G</span>
            <span class="tech-val" id="status-g2_New">Клик для показа</span>
          </div>
        </div>
      </div>

      <!-- Индикатор загрузки -->
      <div id="loaderOverlay" class="loader-overlay hidden">
        <div class="loader-spinner"></div>
        <div class="loader-text" id="loaderText">Загрузка...</div>
      </div>
    </main>
  </div>

  <!-- Cache buster v3.5 -->
  <script src="app.js?v=4.0"></script>
</body>
</html>
